version: 2

models:
  - name: int_postings_enriched
    description: >
      One row per job posting, staged postings with sparse/low-value
      columns dropped and posting_detail_level derived, based on EDA
      findings (see notebooks/eda/).

    columns:
      - name: job_posting_id
        description: "Unique identifier for the posting, carried from staging."
        tests:
          - unique
          - not_null

      - name: job_title
        description: "Raw job title text as posted."
        tests:
          - not_null

      - name: posting_detail_level
        description: >
          'detailed' or 'minimal', derived from whether education_los is
          populated. Reflects a structural finding from EDA: six columns
          (education_los, experience_level, naics, employment_term_weekend,
          employment_term_telework, hours_per) are null together in ~57.6%
          of postings, suggesting two distinct posting submission paths.
        tests:
          - accepted_values:
              arguments:
                values: ['detailed', 'minimal']

      - name: province_territory
        description: "Province or Territory Name."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Alberta', 'British Columbia', 'Manitoba', 'New Brunswick',
                    'Newfoundland and Labrador', 'Northwest Territories', 'Nova Scotia',
                    'Nunavut', 'Ontario', 'Prince Edward Island', 'Québec',
                    'Saskatchewan', 'Yukon']

      - name: posting_date
        description: "Date the posting first appeared on Job Bank."
        tests:
          - not_null

      # Columns below are carried through with light documentation
      # but no test, not currently considered high-risk for silently
      # producing wrong results if a bad value slips in.
      - name: noc16_code
        description: >
          NOC 2016 code. Null for 356 rows: 354 with no occupation classification
          at all, plus 2 rows with a valid noc21_code but no NOC16 equivalent,
          cause unconfirmed. The job titles for these 2 rows (production
          supervisor, administrative support) are ordinary roles, not new
          occupation categories, so this doesn't appear to be a genuine NOC21
          classification gap. Standardized to 'Not specified'.
      - name: noc16_code_name
        description: "Corresponding description for its NOC 2016 code."
      - name: noc21_code
        description: "NOC 2021 unit-group code, always 5 digits (leading zeros preserved)."
      - name: noc21_code_name
        description: "Corresponding description for its NOC 2021 code."
      - name: vacancy_count
        description: "Number of positions advertised in this posting."
      - name: official_language
        description: >
          Language(s) the posting is available in. Source used the literal string
          '*No data' rather than a true null for missing values, standardized to
          'Not specified' here, same convention planned for other categorical
          nulls (employment_type, employment_term).
      - name: city
        description: >
          City the posting is located in. Null for 393 rows (~0.7%) where only
          province_territory was captured. Confirmed no postal code or other
          location fallback exists for these rows. Standardized to 'Not specified'.
      - name: economic_region
        description: >
          Sub-provincial economic region. Null exactly where city is null (393
          rows, confirmed 1:1 correlation). Likely derived from city upstream,
          so missing city means no region to derive. Standardized to 'Not specified'.
      - name: employment_type
        description: >
          Full time / Part time / Part time leading to full time. Null for 1,798
          rows (3.3%). Considered inferring from employment_term (89.2% of
          "Permanent employment" rows are Full time when both fields are known),
          but declined: confidence is below the bar used for salary_period
          (~100%), and the inference would only resolve ~167 of 1,798 nulls
          while introducing a ~11% error rate on those rows. Standardized to
          'Not specified' instead.
      - name: employment_term
        description: >
          Permanent / Term or contract / Seasonal / Casual employment. Null for
          12,098 rows (22.5%). Notably sparser than other core fields, weakly
          correlated with employment_type being null (only 699 of 12,098 null
          together). No placeholder-string pattern found. Standardized to
          'Not specified'.
      - name: salary_condition_detail
        description: "Description of how the work is paid per unit of time or/and the salary range (example: $X hourly)."
      - name: salary_period_raw
        description: "salary_period exactly as it appeared in the source, before any inference."
      - name: salary_period
        description: >
          salary_period, with several corrections layered on, refined across
          two months of real data:
          (1) ~63 missing values inferred from salary_min's magnitude
          (< $1000 -> Hour, >= $1000 -> Year);
          (2) values mislabeled under Hour/Day/Week/Bi-weekly/Month when
          salary_min exceeded a period-specific plausibility threshold
          (e.g. > $200/hr, > $30,000/month). Relabeled to 'Year';
          (3) rows where salary_condition_detail contains no '$' sign (e.g.
          a union local number like "CUPE Local 777-01") or the phrase
          "per night" (a period this model doesn't support). Set to null;
          (4) salary_min values exceeding $10M, symptomatic of a source
          text-extraction bug that concatenates two figures into one.
          Set to null;
          and (5) one row (job_posting_id 15828371, "$600/Hour" for an
          articling law student) left null. Genuinely ambiguous between
          multiple plausible periods, with no magnitude-based signal to
          resolve it, unlike the other corrections.
      - name: salary_period_was_inferred
        description: "True if salary_period was derived or corrected via any of the rules above, rather than taken as-is from the source."
      - name: salary_min
        description: >
          Minimum stated salary, not yet normalized to a common period.
          Nulled when salary_condition_detail has no '$' sign, states a
          "per night" rate, or exceeds $10M (see salary_period).
      - name: salary_max
        description: >
          Maximum stated salary, not yet normalized to a common period.
          Independently validated against the same period-specific
          plausibility thresholds as salary_min. Found to have its own,
          separate mislabeling pattern (e.g. "$100.00 to $110,000.00
          hourly", where only the max side was corrupted). Nulled when
          implausible, without altering salary_period or salary_min.
      - name: hours_per_raw
        description: "hours_per exactly as it appeared in the source, before any inference or correction."
      - name: hours_per
        description: >
          Period hours_min/max are expressed in, corrected in its own CTE
          (with_hours_per) so downstream logic reads the final value, not
          the raw one. Corrections, refined across two months of data:
          (1) ~3,470 rows with hours values but no stated period, inferred
          as 'Week' when hours_min was a plausible weekly figure;
          (2) hours_per='Year' rows where hours_min was under 80. Found to
          be real weekly hours mislabeled as annual (confirmed as a
          recurring pattern, not a one-off, after appearing across multiple
          postings in both months). Relabeled to 'Week';
          (3) hours_per='Year' rows where hours_min was under 10 . Too
          small to be either a real annual or weekly figure. Set to null.
      - name: hours_per_was_inferred
        description: "True if hours_per was derived or corrected via any of the rules above, rather than taken as-is from the source."
      - name: hours_min
        description: >
          Minimum stated hours, in the period given by the corrected
          hours_per. Nulled in two situations: values exceeding a period's
          physical calendar maximum (e.g. over 336 hours in a bi-weekly
          period), and values implausibly small for their period (under 5
          hours/week, under 10 hours/year). Both patterns found to recur
          across months, not isolated incidents. Legitimate high values
          (e.g. 168 hours/bi-weekly for oil & gas drilling crews, 84
          hours/week for marine crew) were confirmed against known
          rotational shift patterns in those industries and kept as-is.
          Capping to the physical maximum or imputing a group average was
          considered and declined in favor of nulling, since at low volume
          nulling is the more honest representation of "value unknown"
          versus fabricating a plausible-looking number.
      - name: hours_max
        description: "Maximum stated hours, in the period given by the corrected hours_per. Same cleaning and validation logic as hours_min."
      - name: weekly_hours_basis
        description: >
          Estimated weekly hours, normalized from hours_per/hours_min/hours_max
          regardless of their original unit. Falls back to 40 when no hours data
          exists (see weekly_hours_source).
      - name: weekly_hours_source
        description: "'actual' when derived from real hours data, 'assumed_40' when falling back to a standard workweek."
      - name: salary_annual_min
        description: "Annualized minimum salary. Direct for Year/Month/Bi-weekly/Week; estimated for Hour (via weekly_hours_basis) and Day (assumes a 5-day workweek)."
      - name: salary_annual_max
        description: "Annualized maximum salary. Same method as salary_annual_min."
      - name: salary_annual_method
        description: "'direct' or 'estimated' (see salary_annual_min)."
      - name: salary_hourly_min
        description: "Estimated hourly minimum rate. Direct for Hour postings; derived from salary_annual_min otherwise."
      - name: salary_hourly_max
        description: "Estimated hourly maximum rate. Same method as salary_hourly_min."
      - name: salary_hourly_method
        description: "'direct' or 'estimated' (see salary_hourly_min)."

    tests:  
      - dbt_utils.expression_is_true:
          arguments:
            expression: "noc16_code = 'Not specified' or length(noc16_code) = 4"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "noc21_code = 'Not specified' or length(noc21_code) = 5"
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (hours_per != 'Week' or hours_min is null or hours_min <= 168)
              and (hours_per != 'Bi-weekly' or hours_min is null or hours_min <= 336)
              and (hours_per != 'Month' or hours_min is null or hours_min <= 744)
              and (hours_per != 'Year' or hours_min is null or hours_min <= 8760)
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (hours_per != 'Week' or hours_max is null or hours_max <= 168)
              and (hours_per != 'Bi-weekly' or hours_max is null or hours_max <= 336)
              and (hours_per != 'Month' or hours_max is null or hours_max <= 744)
              and (hours_per != 'Year' or hours_max is null or hours_max <= 8760)
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              not (salary_period_was_inferred and salary_period_raw is null
                  and salary_period = 'Hour' and salary_min >= 1000)
              and not (salary_period_was_inferred and salary_period_raw is null
                  and salary_period = 'Year' and salary_min < 1000)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "salary_annual_min is null or (salary_annual_min >= 0 and salary_annual_min <= 1000000)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "salary_annual_max is null or (salary_annual_max >= 0 and salary_annual_max <= 1000000)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "salary_hourly_min is null or (salary_hourly_min >= 0 and salary_hourly_min <= 1000)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "salary_hourly_max is null or (salary_hourly_max >= 0 and salary_hourly_max <= 1000)"
version: 2

models:
  - name: dim_date
    description: >
      One row per calendar day, 2023-01-01 to 2026-12-31, generated
      independently of postings data via dbt_utils.date_spine so every
      day is represented (including days with zero postings). Letting
      Power BI drill down from year to quarter to month to day.
    columns:
      - name: date_day
        description: "The calendar date, used as the join key from fct_postings."
        tests:
          - unique
          - not_null
      - name: date_key
        description: "Integer YYYYMMDD surrogate key, for BI tools that prefer an integer join key over a date type."
        tests:
          - unique
          - not_null
  - name: dim_geography
    description: >
      One row per distinct province/city/economic_region combination found
      in int_postings_enriched, including a 'Not specified' row for the
      393 postings missing location detail (see int_postings_enriched
      docs for the city/economic_region null correlation finding).
    columns:
      - name: geography_id
        description: "Surrogate key, hashed from province_territory + city + economic_region."
        tests:
          - unique
          - not_null
      - name: province_territory
        tests:
          - not_null
  - name: dim_occupation
    description: >
      One row per distinct noc16_code/noc21_code combination found in
      int_postings_enriched, including a 'Not specified' row for postings
      with no occupation classification (see int_postings_enriched docs
      for the NOC null-handling and the unresolved 2-row NOC16/21
      mismatch finding).
    columns:
      - name: occupation_id
        description: "Surrogate key, hashed from noc16_code + noc21_code."
        tests:
          - unique
          - not_null
      - name: noc21_code
        tests:
          - not_null
  - name: dim_employment
    description: >
      Junk dimension bundling low-cardinality categorical attributes:
      employment_type, employment_term, official_language, and
      posting_detail_level. Distinct combinations found in
      int_postings_enriched, hashed into a single surrogate key.
    columns:
      - name: employment_id
        description: "Surrogate key, hashed from employment_type + employment_term + official_language + posting_detail_level."
        tests:
          - unique
          - not_null
version: 2

models:
  - name: stg_job_postings
    description: >
      One row per posting, lightly cleaned and typed from bronze. Handles
      known source drift (missing job_posting_id for Jun-Sep 2024, two date
      formats). No business logic.
    columns:
      - name: job_posting_id
        description: >
          Unique identifier for the posting. Sourced directly from
          WIC Job Location Snapshot ID when present; generated as a
          SHA-256 hash of job_title, posting_date, location, salary, and
          NOC code when absent (confirmed: entirely missing for all of
          June, July, August, and September 2024, see job_posting_id_was_generated). Changed
          from bigint to string to accommodate generated IDs.
        data_tests:
          - unique
          - not_null

      - name: job_posting_id_was_generated
        description: "True if job_posting_id was generated (source ID missing), false if sourced directly."
        data_tests:
          - not_null
      - name: posting_date
        description: >
          Parsed from First Posting Date, trying yyyy/MM/dd and then
          yyyy-MM-dd (June-Sept 2024 use dashes, other months use slashes).
          Null means both formats failed, i.e. a new date format has
          appeared in the source.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length(noc16_code) = 4"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length(noc21_code) = 5"